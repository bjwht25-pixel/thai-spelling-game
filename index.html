<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เขียนผิดได้ไง!</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>

            theme: {
                extend: {
                    colors: {
                        pastelBg: '#F3E8FF',
                        pastelCard: '#FFFFFF',
                        pastelPink: '#FFB7B2',
                        pastelGreen: '#C7CEEA',

                        softGreen: '#67C5A3',

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.08);
        }

        .btn-bounce {
            transition: all 0.2s ease;
        }
        .btn-bounce:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .btn-bounce:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Pulse animation for timer */
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .timer-warning {
            animation: pulse-fast 0.6s infinite;
            color: #EF4444 !important;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #A78BFA;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen">

    <div id="app" class="w-full max-w-lg">

        <div id="start-screen" class="glass-card rounded-3xl p-6 sm:p-8 text-center animate__animated animate__fadeIn">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-2 font-prompt">คนไทยNative</h1>
            <p class="text-gray-600 mb-6 text-sm sm:text-base">ทดสอบความเป็นคนไทยในตัวคุณ</p>

            <form id="start-form" onsubmit="startGame(event)" class="space-y-4">
                <div class="text-left">
                    <label for="player-name" class="block text-sm font-semibold text-gray-700 mb-1 ml-1">กรอกชื่อของคุณ</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" id="player-name" required maxlength="15" placeholder="น้องชื่ออะไร" 
                            class="w-full pl-10 pr-4 py-3 rounded-2xl border-2 border-purple-200 focus:border-purple-500 focus:outline-none transition-colors bg-white/80 text-gray-800 text-lg">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 px-6 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white font-bold text-lg rounded-2xl shadow-lg btn-bounce flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> เริ่ม!
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-purple-100">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-gray-700 flex items-center gap-2">
                        <i class="fa-solid fa-trophy text-yellow-500"></i> ใครคือคนไทยคนแรก
                    </h3>
                    <button onclick="clearLeaderboard()" class="text-xs text-gray-400 hover:text-red-500 underline">ล้างสถิติ</button>
                </div>
                <div id="start-leaderboard" class="space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto pr-1">
                </div>

        <div id="game-screen" class="glass-card rounded-3xl p-6 sm:p-8 hidden">
            <!-- Top Bar: Progress & Timer -->

                <div class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-1.5">

                    <i class="fa-solid fa-stopwatch animate-spin"></i> <span id="timer-text">10</span>s
                </div>
                <div class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-star text-yellow-500"></i> <span id="current-score">0</span> คะแนน

            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 h-2.5 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-purple-500 to-indigo-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
            </div>

            <!-- Question Area -->
            <div class="text-center my-6">
                <p class="text-xs font-semibold text-purple-600 uppercase tracking-wider mb-1">เลือกคำที่เขียนสะกดถูกต้อง</p>
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 font-prompt">คำไหนสะกดถูกต้อง?</h2>
            </div>

            <!-- Options (2 choices) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6" id="options-container">
                <button id="btn-opt-0" onclick="selectAnswer(0)" class="option-btn py-5 px-4 bg-white hover:bg-purple-50 border-2 border-purple-200 rounded-2xl text-xl font-bold text-gray-800 shadow-sm transition-all btn-bounce flex items-center justify-center gap-2">
                    <span>คำเลือก A</span>
                </button>
                <button id="btn-opt-1" onclick="selectAnswer(1)" class="option-btn py-5 px-4 bg-white hover:bg-purple-50 border-2 border-purple-200 rounded-2xl text-xl font-bold text-gray-800 shadow-sm transition-all btn-bounce flex items-center justify-center gap-2">
                    <span>คำเลือก B</span>

            <!-- Feedback Message Box -->

                <div id="feedback-title" class="font-bold text-lg mb-1 flex items-center gap-2"></div>

        </div>

        <!-- ================= RESULT SCREEN ================= -->
        <div id="result-screen" class="glass-card rounded-3xl p-6 sm:p-8 text-center hidden animate__animated animate__fadeIn">
            <div id="result-icon-container" class="inline-block p-4 bg-yellow-100 rounded-full mb-3 text-yellow-500 text-5xl">
                <i class="fa-solid fa-crown animate__animated animate__tada"></i>
            </div>
            
            <h2 id="result-badge" class="text-2xl sm:text-3xl font-bold text-gray-800 mb-1 font-prompt">สุดยอดมาก!</h2>
            <p id="result-player-name" class="text-purple-600 font-semibold mb-4 text-lg">คุณนกฮูก</p>

            <!-- Score Cards -->
            <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-6">
                <div class="bg-purple-50 p-3 rounded-2xl border border-purple-100">
                    <p class="text-xs text-gray-500">ตอบถูก</p>
                    <p class="text-xl sm:text-2xl font-bold text-purple-700" id="res-correct-count">0/10</p>
                </div>
                <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100">
                    <p class="text-xs text-gray-500">คะแนนรวม</p>
                    <p class="text-xl sm:text-2xl font-bold text-indigo-700" id="res-total-score">0</p>
                </div>
                <div class="bg-pink-50 p-3 rounded-2xl border border-pink-100">
                    <p class="text-xs text-gray-500">เวลารวม</p>
                    <p class="text-xl sm:text-2xl font-bold text-pink-600" id="res-time-used">0s</p>
                </div>
            </div>

            <!-- Leaderboard Table -->
            <div class="mb-6 text-left">
                <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2 text-base">
                    <i class="fa-solid fa-ranking-star text-purple-600"></i> ตารางคะแนนสูงสุด
                </h3>
                <div class="bg-white/80 rounded-2xl p-3 border border-purple-100 max-h-48 overflow-y-auto">
                    <table class="w-full text-sm text-left">
                        <thead>
                            <tr class="text-xs text-gray-400 border-b border-gray-100 pb-2">
                                <th class="py-1">อันดับ</th>
                                <th class="py-1">ชื่อผู้เล่น</th>
                                <th class="py-1 text-center">คะแนน</th>
                                <th class="py-1 text-right">เวลา</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="divide-y divide-gray-100">
                            <!-- Dynamic Leaderboard Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Restart Button -->
            <button onclick="resetGameToStart()" class="w-full py-3.5 px-6 bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white font-bold text-lg rounded-2xl shadow-lg btn-bounce flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> เล่นอีกครั้ง 
            </button>
        </div>

    </div>

    <!-- AUDIO SYNTHESIS (Web Audio API - No external sounds needed) -->
    <script>
        // Sound FX using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.2); // A5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25); // A2
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'finish') {
                // Arpeggio
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.value = freq;
                    gain2.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                    osc2.start(now + idx * 0.1);
                    osc2.stop(now + idx * 0.1 + 0.3);
                });
            }
        }
    </script>

    <!-- GAME LOGIC -->
    <script>
        // WORD DATABASE (20 Pairs)
        const wordDatabase = [
            { correct: "อนุญาต", wrong: "อนุญาติ", desc: "ไม่มี สระอิ ที่ ต.เต่า (ย้อนจำ: ญาติ มีอิ, อนุญาต ไม่มีอิ)" },
            { correct: "สังเกต", wrong: "สังเกตุ", desc: "ไม่มี สระอุ ที่ ต.เต่า" },
            { correct: "กะเพรา", wrong: "กระเพรา", desc: "ใช้ 'กะ' (ไม่มี ร) และ 'เพรา' (มี ร)" },
            { correct: "ผัดกะเพรา", wrong: "ผัดกระเพรา", desc: "คำว่า กะเพรา ไม่ต้องใส่ ร.เรือ ตรง กะ" },
            { correct: "ลายเซ็น", wrong: "ลายเซ็นต์", desc: "ไม่มี ต.เต่า การันต์" },
            { correct: "โน้ต", wrong: "โน๊ต", desc: "ใช้ไม้โท ไม่ใช่ไม้ตรี (อักษรต่ำใช้ไม้โทออกเสียงตรี)" },
            { correct: "โควตา", wrong: "โควต้า", desc: "คำยืมภาษาอังกฤษ ไม่ต้องใส่วรรณยุกต์ตรี" },
            { correct: "เว็บไซต์", wrong: "เว็ปไซต์", desc: "ใช้ ส.เสือ และ ป.ปลา สะกด (Website)" },
            { correct: "กราฟิก", wrong: "กราฟฟิก", desc: "ใช้ ฟ.ฟัน ตัวเดียว (Graphic)" },
            { correct: "คำนวณ", wrong: "คำนวน", desc: "ใช้ ณ.นกเณร สะกด" },
            { correct: "เกม", wrong: "เกมส์", desc: "คำว่า เกม ในภาษาไทยมาตรฐานไม่ต้องใส่ ส.เสือ การันต์" },
            { correct: "บล็อก", wrong: "บล็อค", desc: "ใช้ ก.ไก่ สะกด (Block)" },
            { correct: "เค้ก", wrong: "เค๊ก", desc: "ใช้ไม้โท ไม่ใช้ไม้ตรี" },
            { correct: "คลินิก", wrong: "คลินิค", desc: "ใช้ ก.ไก่ สะกด (Clinic)" },
            { correct: "ผูกพัน", wrong: "ผูกพันธ์", desc: "ไม่มี ธ.ธง การันต์ (พันธ์ ใช้กับ เผ่าพันธุ์)" },
            { correct: "โอกาส", wrong: "โอกาศ", desc: "ใช้ ส.เสือ สะกด" },
            { correct: "มุกตลก", wrong: "มุขตลก", desc: "มุกตลก ใช้ มุก (ก.ไก่) ส่วน มุข หมายถึง หน้าจั่ว/อาคาร" },
            { correct: "สัมมนา", wrong: "สัมนา", desc: "มี ม.ม้า 2 ตัว (สัมมนา)" },
            { correct: "กะทัดรัด", wrong: "กระทัดรัด", desc: "ใช้ 'กะ' ไม่มี ร.เรือ" },
            { correct: "ซีรีส์", wrong: "ซีรี่ย์", desc: "ทับศัพท์ Series ใช้ ร.เรือ สระอี และ ส.เสือ การันต์" }
        ];

        // GAME STATES
        let playerName = "";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let timer = null;
        let timeLeft = 10;
        let totalTimeUsed = 0;
        let isAnswered = false;

        // ON LOAD
        window.onload = function() {
            renderStartLeaderboard();
        };

        // START GAME
        function startGame(e) {
            e.preventDefault();
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) return;

            playSound('click');
            playerName = nameInput;
            score = 0;
            correctAnswersCount = 0;
            totalTimeUsed = 0;
            currentQuestionIndex = 0;

            // Pick 10 random questions from database
            const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 10);

            // Switch Screen
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            loadQuestion();
        }

        // LOAD QUESTION
        function loadQuestion() {
            isAnswered = false;
            const q = currentQuestions[currentQuestionIndex];

            // Update UI elements
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('current-score').innerText = score;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / 10) * 100}%`;

            // Reset feedback box
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.add('hidden');
            feedbackBox.className = "mt-4 p-4 rounded-2xl hidden animate__animated animate__fadeIn";

            // Prepare choices (randomize correct & wrong order)
            const isCorrectFirst = Math.random() < 0.5;
            const choices = isCorrectFirst 
                ? [{ text: q.correct, isCorrect: true }, { text: q.wrong, isCorrect: false }]
                : [{ text: q.wrong, isCorrect: false }, { text: q.correct, isCorrect: true }];

            q.choices = choices; // store current setup

            // Render buttons
            for (let i = 0; i < 2; i++) {
                const btn = document.getElementById(`btn-opt-${i}`);
                btn.className = "option-btn py-5 px-4 bg-white hover:bg-purple-50 border-2 border-purple-200 rounded-2xl text-xl font-bold text-gray-800 shadow-sm transition-all btn-bounce flex items-center justify-center gap-2";
                btn.disabled = false;
                btn.innerHTML = `<span>${choices[i].text}</span>`;
            }

            // Start Timer (10s per question)
            startTimer();
        }

        // TIMER SYSTEM
        function startTimer() {
            clearInterval(timer);
            timeLeft = 10;
            updateTimerUI();

            timer = setInterval(() => {
                timeLeft--;
                totalTimeUsed++;
                updateTimerUI();

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerContainer = document.getElementById('timer-container');
            const timerText = document.getElementById('timer-text');
            timerText.innerText = timeLeft;

            if (timeLeft <= 3) {
                timerContainer.classList.add('timer-warning');
            } else {
                timerContainer.classList.remove('timer-warning');
            }
        }

        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;

            playSound('wrong');
            const q = currentQuestions[currentQuestionIndex];

            // Highlight buttons
            for (let i = 0; i < 2; i++) {
                const btn = document.getElementById(`btn-opt-${i}`);
                btn.disabled = true;
                if (q.choices[i].isCorrect) {
                    btn.className = "option-btn py-5 px-4 bg-emerald-500 text-white border-2 border-emerald-600 rounded-2xl text-xl font-bold shadow-md flex items-center justify-center gap-2";
                    btn.innerHTML += ` <i class="fa-solid fa-circle-check"></i>`;
                }
            }

            // Show feedback timeout
            showFeedback(false, `หมดเวลา! คำที่ถูกต้องคือ <strong>"${q.correct}"</strong><br><span class="text-xs text-gray-600">${q.desc}</span>`);

            setTimeout(nextQuestion, 1500);
        }

        // SELECT ANSWER
        function selectAnswer(index) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);

            const q = currentQuestions[currentQuestionIndex];
            const selected = q.choices[index];
            const isCorrect = selected.isCorrect;

            // Disable both buttons
            for (let i = 0; i < 2; i++) {
                document.getElementById(`btn-opt-${i}`).disabled = true;
            }

            const chosenBtn = document.getElementById(`btn-opt-${index}`);

            if (isCorrect) {
                playSound('correct');
                correctAnswersCount++;
                // Score calculation: Base 100 pts + bonus time left * 10
                const pointsGained = 100 + (timeLeft * 10);
                score += pointsGained;

                chosenBtn.className = "option-btn py-5 px-4 bg-emerald-500 text-white border-2 border-emerald-600 rounded-2xl text-xl font-bold shadow-md animate__animated animate__rubberBand flex items-center justify-center gap-2";
                chosenBtn.innerHTML += ` <i class="fa-solid fa-circle-check"></i>`;

                showFeedback(true, `ถูกต้อง! (+${pointsGained} คะแนน)<br><span class="text-xs text-emerald-800">${q.desc}</span>`);
            } else {
                playSound('wrong');
                chosenBtn.className = "option-btn py-5 px-4 bg-rose-500 text-white border-2 border-rose-600 rounded-2xl text-xl font-bold shadow-md animate__animated animate__shakeX flex items-center justify-center gap-2";
                chosenBtn.innerHTML += ` <i class="fa-solid fa-circle-xmark"></i>`;

                // Highlight correct one
                const correctIdx = q.choices.findIndex(c => c.isCorrect);
                const correctBtn = document.getElementById(`btn-opt-${correctIdx}`);
                correctBtn.className = "option-btn py-5 px-4 bg-emerald-100 text-emerald-800 border-2 border-emerald-400 rounded-2xl text-xl font-bold shadow-sm flex items-center justify-center gap-2";

                showFeedback(false, `ผิดเลย! คำที่ถูกคือ <strong>"${q.correct}"</strong><br><span class="text-xs text-rose-800">${q.desc}</span>`);
            }

            document.getElementById('current-score').innerText = score;

            // Wait 1.2s then go next
            setTimeout(nextQuestion, 1200);
        }

        // FEEDBACK DISPLAY
        function showFeedback(isSuccess, htmlContent) {
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');

            feedbackBox.classList.remove('hidden');

            if (isSuccess) {
                feedbackBox.className = "mt-4 p-4 rounded-2xl bg-emerald-100 border border-emerald-300 text-emerald-900 animate__animated animate__fadeIn";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-face-smile text-emerald-600 text-xl"></i> เก่งมาก!`;
            } else {
                feedbackBox.className = "mt-4 p-4 rounded-2xl bg-rose-100 border border-rose-300 text-rose-900 animate__animated animate__fadeIn";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-face-sad-tear text-rose-600 text-xl"></i> ยังไม่ใช่...`;
            }

            feedbackDesc.innerHTML = htmlContent;
        }

        // NEXT QUESTION OR FINISH
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        // END GAME & SHOW RESULT
        function endGame() {
            clearInterval(timer);
            playSound('finish');

            // Save to Leaderboard
            saveScore(playerName, score, totalTimeUsed, correctAnswersCount);

            // Hide game, show result
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            // Trigger Confetti
            if (correctAnswersCount >= 6) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Fill Result UI
            document.getElementById('result-player-name').innerText = `ผู้เล่น: คุณ ${playerName}`;
            document.getElementById('res-correct-count').innerText = `${correctAnswersCount}/10`;
            document.getElementById('res-total-score').innerText = score;
            document.getElementById('res-time-used').innerText = `${totalTimeUsed}s`;

            // Grade feedback
            const badge = document.getElementById('result-badge');
            const iconContainer = document.getElementById('result-icon-container');

            if (correctAnswersCount === 10) {
                badge.innerText = "🏆 ภาษาไทยระดับเซียน!";
                iconContainer.className = "inline-block p-4 bg-yellow-100 rounded-full mb-3 text-yellow-500 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-crown animate__animated animate__tada"></i>`;
            } else if (correctAnswersCount >= 7) {
                badge.innerText = "🌟 แม่นยำสุดๆ!";
                iconContainer.className = "inline-block p-4 bg-purple-100 rounded-full mb-3 text-purple-600 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-star animate__animated animate__bounce"></i>`;
            } else if (correctAnswersCount >= 5) {
                badge.innerText = "👍 ทำได้ดี ใช้ได้เลย!";
                iconContainer.className = "inline-block p-4 bg-blue-100 rounded-full mb-3 text-blue-500 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-thumbs-up"></i>`;
            } else {
                badge.innerText = "✌️ พยายามอีกนิดนะ!";
                iconContainer.className = "inline-block p-4 bg-pink-100 rounded-full mb-3 text-pink-500 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-heart"></i>`;
            }

            renderResultLeaderboard();
        }

        // RESET TO START (MUST RE-ENTER NAME)
        function resetGameToStart() {
            playSound('click');
            document.getElementById('player-name').value = '';
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            renderStartLeaderboard();
        }

        // LOCALSTORAGE LEADERBOARD LOGIC
        function getLeaderboard() {
            const data = localStorage.getItem('thai_word_game_scores');
            return data ? JSON.parse(data) : [];
        }

        function saveScore(name, finalScore, timeUsed, correct) {
            const leaderboard = getLeaderboard();
            leaderboard.push({
                name: name,
                score: finalScore,
                time: timeUsed,
                correct: correct,
                date: new Date().toLocaleDateString('th-TH')
            });

            // Sort by Score DESC, then Time ASC
            leaderboard.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.time - b.time;
            });

            // Keep top 20
            const topScores = leaderboard.slice(0, 20);
            localStorage.setItem('thai_word_game_scores', JSON.stringify(topScores));
        }

        function clearLeaderboard() {
            if (confirm("คุณต้องการล้างสถิติตารางคะแนนทั้งหมดใช่หรือไม่?")) {
                localStorage.removeItem('thai_word_game_scores');
                renderStartLeaderboard();
            }
        }

        function renderStartLeaderboard() {
            const leaderboard = getLeaderboard();
            const container = document.getElementById('start-leaderboard');

            if (leaderboard.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-2">ยังไม่มีสถิติ เป็นคนแรกที่เล่นเลย!</p>`;
                return;
            }

            let html = '';
            leaderboard.slice(0, 5).forEach((item, index) => {
                let badgeColor = "text-gray-500";
                if (index === 0) badgeColor = "text-yellow-500 font-bold";
                if (index === 1) badgeColor = "text-gray-400 font-bold";
                if (index === 2) badgeColor = "text-amber-600 font-bold";

                html += `
                    <div class="flex items-center justify-between py-1.5 px-3 bg-white/60 rounded-xl">
                        <div class="flex items-center gap-2">
                            <span class="${badgeColor} w-5 text-center">#${index + 1}</span>
                            <span class="font-medium text-gray-800">${escapeHtml(item.name)}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-purple-600">${item.score} pt</span>
                            <span class="text-xs text-gray-400 ml-1">(${item.time}s)</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderResultLeaderboard() {
            const leaderboard = getLeaderboard();
            const tbody = document.getElementById('leaderboard-body');

            if (leaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-3 text-gray-400">ไม่มีข้อมูล</td></tr>`;
                return;
            }

            let html = '';
            leaderboard.forEach((item, index) => {
                const isCurrentPlayer = item.name === playerName && item.score === score;
                const highlightClass = isCurrentPlayer ? "bg-purple-100 font-bold" : "";

                html += `
                    <tr class="${highlightClass}">
                        <td class="py-2 px-1">
                            ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}
                        </td>
                        <td class="py-2 px-1 truncate max-w-[100px]">${escapeHtml(item.name)}</td>
                        <td class="py-2 px-1 text-center text-purple-600 font-semibold">${item.score}</td>
                        <td class="py-2 px-1 text-right text-gray-500">${item.time}s</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
