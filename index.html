    <!-- AUDIO SYNTHESIS (Web Audio API) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.18); // A5
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'finish') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            } else if (type === 'combo') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }
    </script>

            { correct: "ศรีษะ", wrong: "ศีรษะ", desc: "ศีรษะ เขียน ส.เสือ ศ.ศาลา ร.เรือ สระอี (ศ-ร-ี)" },

            { correct: "ประณีต", wrong: "ปราณีต", desc: "ประณีต ใช้ ป.ปลา ร.เรือ และ ณ.เณร" },
            { correct: "อัญชลี", wrong: "อันชลี", desc: "ใช้ ญ.หญิง สะกด" },
            { correct: "เทคโนโลยี", wrong: "เทคโนโลยี่", desc: "คำว่า 'ยี' ไม่มีไม้เอก" },
            { correct: "ไอศกรีม", wrong: "ไอศครีม", desc: "ใช้ ก.ไก่ สะกด (Ice cream)" },
            { correct: "แก๊ง", wrong: "แก๊งค์", desc: "ไม่มี ค.ควาย การันต์" },
            { correct: "สแกน", wrong: "สแคน", desc: "ใช้ ก.ไก่ สะกด (Scan)" },
            { correct: "การ์ตูน", wrong: "การ์ตูนต์", desc: "การ์ตูน ไม่มี ต.เต่า การันต์ท้ายคำ" },
            { correct: "คุกกี้", wrong: "คุ้กกี้", desc: "ใช้ไม้โทที่ ก.ไก่ (คุกกี้)" },
            { correct: "แท็กซี่", wrong: "แท๊กซี่", desc: "ใช้ไม้ไต่คู้ หรือไม่ใส่วรรณยุกต์ตรี (แท็กซี่)" },
            { correct: "อินเทอร์เน็ต", wrong: "อินเตอร์เน็ต", desc: "ทับศัพท์ Internet ใช้ ท.ทหาร" },
            { correct: "เปอร์เซ็นต์", wrong: "เปอร์เซนต์", desc: "มี ต.เต่า ตร์ การันต์ (Percent)" },
            { correct: "โปรเจกต์", wrong: "โปรเจ็คต์", desc: "ใช้ ก.ไก่ สะกด (Project)" },
            { correct: "ออฟฟิศ", font: "ออฟฟิต", wrong: "ออฟฟิต", desc: "ใช้ ศ.ศาลา สะกด (Office)" },
            { correct: "โพสต์", wrong: "โพส", desc: "มี ต.เต่า การันต์ (Post)" },
            { correct: "กะทิ", wrong: "กระทิ", desc: "ใช้ 'กะ' ไม่มี ร.เรือ" },
            { correct: "ทะลาย", wrong: "ทลาย", desc: "มะพร้าวเป็น 'ทะลาย' (มี สระอะ) / พังทลาย (ไม่มี สระอะ)" },
            { correct: "ทะเลาะ", wrong: "ทะเลอะ", desc: "ใช้ สระเอาะ (ทะเลาะ)" },
            { correct: "ปะรำ", wrong: "ประรำ", desc: "ใช้ 'ปะ' ไม่มี ร.เรือ" },
            { correct: "ผัดไทย", wrong: "ผัดไท", desc: "ผัดไทย มี ย.ยักษ์ สะกด" },
            { correct: "แคปซูล", wrong: "แค็ปซูล", desc: "ใช้ ป.ปลา สะกด ไม่ต้องใส่ไม้ไต่คู้" },
            { correct: "พลาสติก", wrong: "พลาสติ๊ก", desc: "ใช้ ก.ไก่ ไม่มีไม้ตรี" },
            { correct: "สวิตช์", wrong: "สวิทช์", desc: "ใช้ ต.เต่า สะกด (Switch)" },
            { correct: "ลอตเตอรี", wrong: "ลอตเตอรี่", desc: "คำทับศัพท์มาตรฐานไม่มีไม้เอก" },
            { correct: "เสบียง", wrong: "เสบียงค์", desc: "เสบียง ไม่มี ค.ควาย การันต์" },
            { correct: "เฉยว่อง", wrong: "เฉลียวฉลาด", desc: "ตัวอย่างคำไทยโบราณมักสะกดผิด" },
            { correct: "อัศจรรย์", wrong: "อัศจรรย์ใจ", desc: "อัศจรรย์ ใช้ รร (เรารวม) ย.ยักษ์ การันต์" },
            { correct: "อุปทาน", wrong: "อุปทานหมู่", desc: "อุปทาน (Supply) / อุปาทาน (การยึดมั่นถือมั่น)" },
            { correct: "หลงใหล", wrong: "หลงไหล", desc: "ใช้ สระไอไม้ม้วน (ใหล)" }
        ];

        // GAME STATES
        let playerName = "";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let streak = 0;
        let timer = null;
        let timeLeft = 10;
        let totalTimeUsed = 0;
        let isAnswered = false;
        let sessionAnswersHistory = [];

        // ON LOAD
        window.onload = function() {
            renderStartLeaderboard();
        };

        // MASCOT INTERACTION
        function pokeMascot() {
            playSound('combo');
            const svg = document.getElementById('mascot-svg');
            svg.classList.add('animate__animated', 'animate__rubberBand');
            setTimeout(() => {
                svg.classList.remove('animate__animated', 'animate__rubberBand');
            }, 1000);
        }

        // START GAME
        function startGame(e) {
            e.preventDefault();
            const nameInput = document.getElementById('player-name').value.trim();
            if (!nameInput) return;

            playSound('click');
            playerName = nameInput;
            score = 0;
            correctAnswersCount = 0;
            streak = 0;
            totalTimeUsed = 0;
            currentQuestionIndex = 0;
            sessionAnswersHistory = [];

            // Pick 10 random questions from database
            const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random());
            currentQuestions = shuffled.slice(0, 10);

            // Switch Screen
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            loadQuestion();
        }

        // LOAD QUESTION
        function loadQuestion() {
            isAnswered = false;
            const q = currentQuestions[currentQuestionIndex];

            // Update UI elements
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('current-score').innerText = score;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / 10) * 100}%`;

            // Streak UI
            const streakBadge = document.getElementById('streak-badge');
            if (streak >= 2) {
                streakBadge.classList.remove('hidden');
                document.getElementById('streak-count').innerText = streak;
                document.getElementById('streak-bonus').innerText = streak * 15;
            } else {
                streakBadge.classList.add('hidden');
            }

            // Reset feedback box
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.add('hidden');

            // Prepare choices (randomize correct & wrong order)
            const isCorrectFirst = Math.random() < 0.5;
            const choices = isCorrectFirst 
                ? [{ text: q.correct, isCorrect: true }, { text: q.wrong, isCorrect: false }]
                : [{ text: q.wrong, isCorrect: false }, { text: q.correct, isCorrect: true }];

            q.choices = choices;

            // Render buttons
            for (let i = 0; i < 2; i++) {
                const btn = document.getElementById(`btn-opt-${i}`);
                btn.className = "option-btn py-4 px-4 bg-white hover:bg-purple-50 border-2 border-purple-200 rounded-2xl text-xl font-bold text-gray-800 shadow-sm transition-all btn-bounce flex items-center justify-center gap-2";
                btn.disabled = false;
                btn.innerHTML = `<span>${choices[i].text}</span>`;
            }

            startTimer();
        }

        // TIMER SYSTEM
        function startTimer() {
            clearInterval(timer);
            timeLeft = 10;
            updateTimerUI();

            timer = setInterval(() => {
                timeLeft--;
                totalTimeUsed++;
                updateTimerUI();

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerContainer = document.getElementById('timer-container');
            const timerText = document.getElementById('timer-text');
            timerText.innerText = timeLeft;

            if (timeLeft <= 3) {
                timerContainer.classList.add('timer-warning');
            } else {
                timerContainer.classList.remove('timer-warning');
            }
        }

        function handleTimeout() {
            if (isAnswered) return;
            isAnswered = true;
            streak = 0; // Reset streak

            playSound('wrong');
            const q = currentQuestions[currentQuestionIndex];

            sessionAnswersHistory.push({
                question: q,
                userChoice: "หมดเวลา",
                isCorrect: false
            });

            // Highlight buttons
            for (let i = 0; i < 2; i++) {
                const btn = document.getElementById(`btn-opt-${i}`);
                btn.disabled = true;
                if (q.choices[i].isCorrect) {
                    btn.className = "option-btn py-4 px-4 bg-emerald-500 text-white border-2 border-emerald-600 rounded-2xl text-xl font-bold shadow-md flex items-center justify-center gap-2";
                    btn.innerHTML += ` <i class="fa-solid fa-circle-check"></i>`;
                }
            }

            showFeedback(false, `⏰ หมดเวลา! คำที่ถูกต้องคือ <strong>"${q.correct}"</strong><br><span class="text-xs text-gray-600">${q.desc}</span>`);
            setTimeout(nextQuestion, 1600);
        }

        // SELECT ANSWER
        function selectAnswer(index) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);

            const q = currentQuestions[currentQuestionIndex];
            const selected = q.choices[index];
            const isCorrect = selected.isCorrect;

            sessionAnswersHistory.push({
                question: q,
                userChoice: selected.text,
                isCorrect: isCorrect
            });

            for (let i = 0; i < 2; i++) {
                document.getElementById(`btn-opt-${i}`).disabled = true;
            }

            const chosenBtn = document.getElementById(`btn-opt-${index}`);

            if (isCorrect) {
                streak++;
                correctAnswersCount++;

                // Score calculation: Base 100 + bonus time + streak bonus
                const streakBonus = (streak > 1) ? streak * 15 : 0;
                const pointsGained = 100 + (timeLeft * 10) + streakBonus;
                score += pointsGained;

                if (streak >= 2) {
                    playSound('combo');
                } else {
                    playSound('correct');
                }

                chosenBtn.className = "option-btn py-4 px-4 bg-emerald-500 text-white border-2 border-emerald-600 rounded-2xl text-xl font-bold shadow-md animate__animated animate__rubberBand flex items-center justify-center gap-2";
                chosenBtn.innerHTML += ` <i class="fa-solid fa-circle-check"></i>`;

                showFeedback(true, `ถูกต้อง! (+${pointsGained} คะแนน ${streakBonus ? `รวมคอมโบ 🔥` : ''})<br><span class="text-xs text-emerald-800">${q.desc}</span>`);
            } else {
                streak = 0; // Reset streak
                playSound('wrong');

                chosenBtn.className = "option-btn py-4 px-4 bg-rose-500 text-white border-2 border-rose-600 rounded-2xl text-xl font-bold shadow-md animate__animated animate__shakeX flex items-center justify-center gap-2";
                chosenBtn.innerHTML += ` <i class="fa-solid fa-circle-xmark"></i>`;

                const correctIdx = q.choices.findIndex(c => c.isCorrect);
                const correctBtn = document.getElementById(`btn-opt-${correctIdx}`);
                correctBtn.className = "option-btn py-4 px-4 bg-emerald-100 text-emerald-800 border-2 border-emerald-400 rounded-2xl text-xl font-bold shadow-sm flex items-center justify-center gap-2";

                showFeedback(false, `ยังไม่ถูกต้อง! คำที่ถูกคือ <strong>"${q.correct}"</strong><br><span class="text-xs text-rose-800">${q.desc}</span>`);
            }

            document.getElementById('current-score').innerText = score;
            setTimeout(nextQuestion, 1400);
        }

        // FEEDBACK DISPLAY
        function showFeedback(isSuccess, htmlContent) {
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');

            feedbackBox.classList.remove('hidden');

            if (isSuccess) {
                feedbackBox.className = "mt-4 p-3.5 rounded-2xl bg-emerald-100 border border-emerald-300 text-emerald-900 animate__animated animate__fadeIn";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-face-smile-beam text-emerald-600 text-xl"></i> เก่งมาก!`;
            } else {
                feedbackBox.className = "mt-4 p-3.5 rounded-2xl bg-rose-100 border border-rose-300 text-rose-900 animate__animated animate__fadeIn";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-face-sad-tear text-rose-600 text-xl"></i> คำตอบที่ถูกคือ...`;
            }

            feedbackDesc.innerHTML = htmlContent;
        }

        // NEXT QUESTION
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < 10) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        // END GAME
        function endGame() {
            clearInterval(timer);
            playSound('finish');

            saveScore(playerName, score, totalTimeUsed, correctAnswersCount);

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            if (correctAnswersCount >= 6) {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            document.getElementById('result-player-name').innerText = `ผู้เล่น: คุณ ${playerName}`;
            document.getElementById('res-correct-count').innerText = `${correctAnswersCount}/10`;
            document.getElementById('res-total-score').innerText = score;
            document.getElementById('res-time-used').innerText = `${totalTimeUsed}s`;

            const badge = document.getElementById('result-badge');
            const iconContainer = document.getElementById('result-icon-container');

            if (correctAnswersCount === 10) {
                badge.innerText = "🏆 ภาษาไทยระดับเซียน!";
                iconContainer.className = "inline-block p-4 bg-amber-100 rounded-full mb-2 text-amber-500 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-crown animate__animated animate__tada"></i>`;
            } else if (correctAnswersCount >= 7) {
                badge.innerText = "🌟 แม่นยำสุดๆ!";
                iconContainer.className = "inline-block p-4 bg-purple-100 rounded-full mb-2 text-purple-600 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-star animate__animated animate__bounce"></i>`;
            } else if (correctAnswersCount >= 5) {
                badge.innerText = "👍 ทำได้ดี ใช้ได้เลย!";
                iconContainer.className = "inline-block p-4 bg-blue-100 rounded-full mb-2 text-blue-500 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-thumbs-up"></i>`;
            } else {
                badge.innerText = "✌️ พยายามอีกนิดนะ!";
                iconContainer.className = "inline-block p-4 bg-pink-100 rounded-full mb-2 text-pink-500 text-5xl";
                iconContainer.innerHTML = `<i class="fa-solid fa-heart"></i>`;
            }

            renderResultLeaderboard();
        }

        // RESET GAME
        function resetGameToStart() {
            playSound('click');
            document.getElementById('player-name').value = '';
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            renderStartLeaderboard();
        }

        // REVIEW MODAL
        function toggleReviewModal() {
            playSound('click');
            const modal = document.getElementById('review-modal');
            const isHidden = modal.classList.contains('hidden');

            if (isHidden) {
                renderReviewList();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderReviewList() {
            const container = document.getElementById('review-list');
            let html = '';

            sessionAnswersHistory.forEach((item, index) => {
                const q = item.question;
                const statusColor = item.isCorrect ? "text-emerald-600 bg-emerald-50 border-emerald-200" : "text-rose-600 bg-rose-50 border-rose-200";
                const statusIcon = item.isCorrect ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-circle-xmark"></i>';

                html += `
                    <div class="p-3 rounded-2xl border ${statusColor} text-xs sm:text-sm">
                        <div class="flex justify-between items-center mb-1 font-bold">
                            <span>ข้อที่ ${index + 1}: ${q.correct}</span>
                            <span>${statusIcon} ${item.isCorrect ? 'ตอบถูก' : 'ตอบผิด'}</span>
                        </div>
                        <p class="text-gray-700"><strong>คำที่ถูกต้อง:</strong> <span class="text-emerald-700 font-bold">${q.correct}</span> (ผิดบ่อย: <span class="line-through text-rose-500">${q.wrong}</span>)</p>
                        <p class="text-gray-500 text-xs mt-1"><i class="fa-solid fa-lightbulb text-amber-500"></i> ${q.desc}</p>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // SHARE SCORE
        function shareScore() {
            playSound('click');
            const textToCopy = `🇹🇭 ฉันได้คะแนน ${score} คะแนน (ตอบถูก ${correctAnswersCount}/10 ข้อ) ในเกม "คนไทยNative"! มาลองทดสอบภาษาไทยกันเลย!`;
            
            const tempInput = document.createElement("textarea");
            tempInput.value = textToCopy;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            alert("คัดลอกข้อความชวนเพื่อนแล้ว! นำไปโพสต์ หรือส่งต่อได้เลย 🚀");
        }

        // LEADERBOARD LOGIC
        function getLeaderboard() {
            const data = localStorage.getItem('thai_word_game_scores_v2');
            return data ? JSON.parse(data) : [];
        }

        function saveScore(name, finalScore, timeUsed, correct) {
            const leaderboard = getLeaderboard();
            leaderboard.push({
                name: name,
                score: finalScore,
                time: timeUsed,
                correct: correct,
                date: new Date().toLocaleDateString('th-TH')
            });

            leaderboard.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.time - b.time;
            });

            const topScores = leaderboard.slice(0, 15);
            localStorage.setItem('thai_word_game_scores_v2', JSON.stringify(topScores));
        }

        function clearLeaderboard() {
            if (confirm("ต้องการล้างสถิติตารางคะแนนทั้งหมดใช่หรือไม่?")) {
                localStorage.removeItem('thai_word_game_scores_v2');
                renderStartLeaderboard();
            }
        }

        function renderStartLeaderboard() {
            const leaderboard = getLeaderboard();
            const container = document.getElementById('start-leaderboard');

            if (leaderboard.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-2 text-xs">ยังไม่มีสถิติ มาเปิดคนแรกเลย!</p>`;
                return;
            }

            let html = '';
            leaderboard.slice(0, 5).forEach((item, index) => {
                let badgeColor = "text-gray-400";
                if (index === 0) badgeColor = "text-amber-500 font-bold";
                if (index === 1) badgeColor = "text-slate-400 font-bold";
                if (index === 2) badgeColor = "text-amber-700 font-bold";

                html += `
                    <div class="flex items-center justify-between py-1 px-2.5 bg-white/70 rounded-xl text-xs">
                        <div class="flex items-center gap-2">
                            <span class="${badgeColor} w-4 text-center">#${index + 1}</span>
                            <span class="font-semibold text-gray-800">${escapeHtml(item.name)}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-purple-600">${item.score} pt</span>
                            <span class="text-[10px] text-gray-400 ml-1">(${item.time}s)</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderResultLeaderboard() {
            const leaderboard = getLeaderboard();
            const tbody = document.getElementById('leaderboard-body');

            if (leaderboard.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-2 text-gray-400">ไม่มีข้อมูล</td></tr>`;
                return;
            }

            let html = '';
            leaderboard.forEach((item, index) => {
                const isCurrentPlayer = item.name === playerName && item.score === score;
                const highlightClass = isCurrentPlayer ? "bg-purple-100 font-bold" : "";

                html += `
                    <tr class="${highlightClass}">
                        <td class="py-1.5 px-1">
                            ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}
                        </td>
                        <td class="py-1.5 px-1 truncate max-w-[110px]">${escapeHtml(item.name)}</td>
                        <td class="py-1.5 px-1 text-center text-purple-600 font-bold">${item.score}</td>
                        <td class="py-1.5 px-1 text-right text-gray-500">${item.time}s</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
